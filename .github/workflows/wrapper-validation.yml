name: Validate Gradle wrapper

on:
  push:
    branches: [main]
    paths: [gradle/wrapper/**, gradlew]
  pull_request:
    paths: [gradle/wrapper/**, gradlew]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6
